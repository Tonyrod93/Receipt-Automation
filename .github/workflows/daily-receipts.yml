name: Daily Outlook Receipts To Monday

on:
  push:
    branches: [main]
    paths: ['src/import-receipts.mjs', 'test/**', '.github/workflows/daily-receipts.yml']
  schedule:
    # GitHub Actions schedules are UTC. 13:00 UTC is 8:00 AM Central during CDT.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read-only preflight (false permits pending receipt creation)
        type: choice
        options: ['true', 'false']
        default: 'true'
      max_creates:
        description: Maximum new pending items in this run
        type: string
        default: '1'

concurrency:
  group: receipt-intake
  cancel-in-progress: false

jobs:
  import-receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm install

      - run: node --test test/import-receipts.test.mjs

      - name: Import receipts
        run: npm start
        env:
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MAILBOX_USER: ${{ secrets.MAILBOX_USER }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Temporary verified-source pilot: only the reviewed backfill source may be created.
          DRY_RUN: 'false'
          PILOT_ONLY: 'true'
          MAX_CREATES: '1'
